[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supergraph"
version = "0.7.0"
description = "Agentic brain DB - the cognitive layer for AI agents"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.10"
authors = [
    { name = "Kailash Mahavarkar", email = "kailashmahavarkar5@gmail.com" },
]
keywords = ["graph", "database", "in-memory", "dsl", "sparse-matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "usearch>=2.0",
    "lark>=1.1",
    "msgspec>=0.18",
    "psutil>=5.9",
    "threadpoolctl>=3.1",
    # Tiny, high-leverage. Bundling so that `pip install supergraph` delivers
    # the agentic DB contract out of the box:
    #   - model2vec: default embedder (REMEMBER / RECALL / LEXICAL SEARCH),
    #     ~40 MB wheel + ~30 MB model downloaded on first use.
    #   - croniter: enables `SYS CRON` DSL (~100 KB).
    #   - pyyaml: enables `VAULT SYNC` + YAML frontmatter (~200 KB).
    # Pass `embedder='none'` to SuperGraph() if you want to skip embedder init.
    "model2vec>=0.4",
    "croniter>=6.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/orkait/supergraph"
Repository = "https://github.com/orkait/supergraph"
Issues = "https://github.com/orkait/supergraph/issues"

[project.scripts]
supergraph = "supergraph.cli:main"
supergraph-mcp = "supergraph.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    # httpx is needed by starlette.testclient (used in test_server_endpoints)
    "httpx>=0.24",
    # onnxruntime + tokenizers power the TinyBERT NER path exercised by the
    # test suite. Users without `dev` still need to install them explicitly
    # if they want entity extraction.
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    # Dead-code gate, see [tool.ruff]. Must live here and not only in
    # [dependency-groups] because CI installs the extra, not the uv group.
    "ruff>=0.16",
]
embedders-extra = [
    "fastembed>=0.8",
    "llama-cpp-python>=0.3",
]
# Audio: in-process speech-to-text via faster-whisper (CTranslate2). Small
# Whisper models ship via HuggingFace Hub on first use (base ~150 MB). Unlike
# the vision path (which uses a sidecar because VLM inference is long and
# benefits from server-side batching), whisper transcription is short enough
# to run in-process without IPC overhead.
audio = [
    "faster-whisper>=1.0",
]
ingest = [
    "markitdown>=0.1",
    "pymupdf4llm>=0.1",
    "pymupdf>=1.20",
]
# Heavier ingest backend. docling adds ~1 GB (pulls torch). Install with
# CPU-only torch when you do not need GPU:
#     pip install 'supergraph[ingest-pro]' --extra-index-url https://download.pytorch.org/whl/cpu
# VisionHandler uses stdlib urllib against any OpenAI-compatible endpoint -
# no openai Python SDK dep needed.
ingest-pro = [
    "docling>=2.0",
]
playground = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
]
# MCP server: expose supergraph as agent-callable tools over the Model
# Context Protocol. Required for tools/mcp/supergraph_mcp.py (used by
# Claude Desktop, Cursor, and other MCP-aware clients). The server runs
# in-process by default - no playground HTTP server needed.
mcp = [
    "mcp>=1.0",
]
# Cloud NL->DSL ingestion: multi-provider LLM transport via litellm. Powers
# CloudIngestor (supergraph.ingest.llm) and gs.ingest_nl / ingest_nl_stream.
# Until the in-house compressed model is wired, cloud providers carry NL
# ingestion (the local BonsaiIngestor manages only ~2 TPS on CPU).
cloud = [
    "litellm>=1.72",
]
# onnxruntime-gpu for NER (TinyBERT) CUDA acceleration. Assumes host has
# CUDA 12 + cuDNN 9 findable by the dynamic linker. Users needing bundled
# CUDA runtime wheels should pin nvidia-*-cu12 manually - we keep this lean.
gpu = [
    "onnxruntime-gpu>=1.23; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Vision: llama.cpp sidecar server for image understanding. Ships a local
# OpenAI-compatible HTTP endpoint (SmolVLM-500M by default, ~400 MB GGUF
# downloaded on first use). See `supergraph vision serve` CLI.
vision = [
    "llama-cpp-python[server]>=0.3",
    "huggingface-hub>=0.24",
]
# Pro: aggregate of every extra needed to drive the slotted ProSpec
# (jina-v5-small embedder + jina-v3 reranker + Bonsai NL->DSL ingest +
# vision/audio sidecars + GPU). Adds NO new pip deps; this is a wrapper
# so users can `pip install 'supergraph[pro]'` instead of stringing
# extras together. See `supergraph pro check / setup / probe / status`
# and src/supergraph/pro.py.
pro = [
    "supergraph[ingest]",
    "supergraph[vision]",
    "supergraph[audio]",
    "supergraph[embedders-extra]",
    "supergraph[gpu]",
    "supergraph[mcp]",
    "tokenizers>=0.15",
    "onnxruntime>=1.17",
    "huggingface-hub>=0.24",
]

# No-GPU serverless deploys (Railway / Fly / Render / Cloud Run). Everything that
# needs "understanding" - NL->DSL ingestion AND image/audio/video/pdf media -
# goes to CLOUD LLMs via litellm, so no GPU and no local 4B/VLM/whisper models.
# model2vec (in the base deps) is the fast CPU embedder; pymupdf handles PDFs;
# CPU onnxruntime powers TinyBERT NER. Lean image, fast build. This is the
# install for siphon-on-Railway.
#   Deliberately EXCLUDES: gpu (onnxruntime-gpu, no CUDA), vision/audio sidecars
#   (cloud media replaces them), embedders-extra (llama-cpp / GGUF, CPU-slow),
#   ingest-pro (docling pulls torch ~1 GB).
cloud-cpu = [
    "supergraph[cloud]",
    "supergraph[ingest]",
    "supergraph[playground]",
    "supergraph[mcp]",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface-hub>=0.24",
]

# Everything, for dev machines / GPU hosts. NOT for no-GPU serverless - pulls
# onnxruntime-gpu (dead without CUDA) + docling (torch ~1 GB) + local VLM/whisper
# /4B-GGUF (CPU-slow). On Railway use [cloud-cpu] instead.
all = [
    "supergraph[pro]",
    "supergraph[cloud]",
    "supergraph[ingest-pro]",
    "supergraph[playground]",
]
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["supergraph*"]

[tool.setuptools.package-data]
"supergraph"       = ["py.typed", "*.txt"]
"supergraph.query" = ["py.typed"]
"supergraph.dsl"   = ["*.lark"]

[tool.ruff]
# Dead-code gate. Before this existed the library carried 116 unused imports
# and unused locals, including a function imported into the REMEMBER handler
# and never called, and a variable assigned twice in a row in the BFS.
target-version = "py310"
extend-exclude = ["models", "dist", "docs", "website", "apps", ".venv"]

[tool.ruff.lint]
# Deliberately narrow. This is a regression gate, not a style migration -
# widening it would produce thousands of findings and get switched off.
select = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# In a test, `r = call()` is often there for the call; ruff's F841 fix would
# delete the statement and with it the assertion's subject.
"tests/*" = ["F841"]
"benchmarks/*" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 4: 4 xdist workers. With the 2-thread BLAS cap set in conftest.py
# that's 4 * 2 = 8 threads max. Measured: 118s single -> 66s (-44%).
# Override per run via `pytest -n 0` (serial) or `pytest -n auto`.
#
# --dist loadgroup: respect @pytest.mark.xdist_group so modules that share
# a module-scoped fixture (e.g. tests/test_e2e_real_embedder.py with a
# persistent SuperGraph across classes) stay on one worker. Default
# LoadScheduling ignored the marker and fragmented module state across
# workers, breaking tests that depended on ingest state established in
# an earlier test class in the same module.
addopts = "-n 4 --timeout=60 --dist loadgroup"
markers = [
    "needs_embedder: embedder test (model2vec is now core, kept for compat)",
    "needs_fastembed: requires supergraph[embedders-extra] (fastembed)",
    "needs_ingest: requires supergraph[ingest]",
    "needs_vault: vault test (pyyaml is now core, kept for compat)",
    "needs_scheduler: scheduler test (croniter is now core, kept for compat)",
    "needs_playground: requires supergraph[playground]",
    "needs_gpu: requires supergraph[gpu]",
    "needs_vision: requires supergraph[vision]",
    "needs_audio: requires supergraph[audio]",
]

[tool.bumpversion]
current_version = "0.7.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/supergraph/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "kaggle>=1.7.4.5",
    "kagglesdk>=0.1.19",
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]
