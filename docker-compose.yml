# supergraph docker-compose.
#
# Two profiles:
#   default - CPU image, lightweight, fits 90% of deploys.
#   pro     - CUDA 12 image, pre-pulled Bonsai/jina/tinybert weights.
#
# Usage:
#   docker compose up -d                       # CPU service on :7200
#   docker compose --profile pro up -d         # GPU service (requires nvidia-container-toolkit)
#   docker compose --profile pro run --rm supergraph-pro supergraph pro setup
#
# Resource limits cap CPU and RAM per Docker Rule 12 - prevents a
# supergraph container from saturating the host.

services:
  supergraph:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPERGRAPH_VERSION: "0.6.0"
    image: supergraph:0.6.0
    container_name: supergraph
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      - gs-data:/data
    environment:
      SUPERGRAPH_DB_PATH: /data
      SUPERGRAPH_HOST: 0.0.0.0
      SUPERGRAPH_PORT: "7200"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 7200)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  supergraph-pro:
    profiles: ["pro"]
    build:
      context: .
      dockerfile: Dockerfile.pro
      args:
        SUPERGRAPH_VERSION: "0.6.0"
    image: supergraph-pro:0.6.0
    container_name: supergraph-pro
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      - gs-data:/data
      - gs-cache:/root/.cache/supergraph
      - gs-hf-cache:/root/.cache/huggingface
    environment:
      SUPERGRAPH_DB_PATH: /data
      SUPERGRAPH_HOST: 0.0.0.0
      SUPERGRAPH_PORT: "7200"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 7200)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gs-data:
  gs-cache:
  gs-hf-cache:
