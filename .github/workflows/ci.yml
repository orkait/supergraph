name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        # No LFS - repo tracks nothing via LFS and the org budget is capped.

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # dev pulls onnxruntime + tokenizers + pytest-xdist/timeout/cov.
        # model2vec / croniter / pyyaml are core deps (v0.3.0 consolidation).
        # ingest pulls markitdown + pymupdf.
        # Skipping ingest-pro (docling = torch ~1 GB), audio (faster-whisper),
        # vision (llama-cpp-python + weight download), gpu (onnxruntime-gpu)
        # since they are opt-in extras. Tests for those extras skip when
        # their import is unavailable.
        run: |
          pip install -e ".[dev,playground,ingest]"

      - name: Lint (dead code gate)
        # F401/F841 only, see [tool.ruff.lint] in pyproject. The library
        # accumulated 116 of these before the gate existed.
        run: ruff check .

      - name: Run tests
        # Fast suite only (slow tests marked via pytest.mark.slow).
        # Server tests rely on live ports and are excluded (test_server.py),
        # e2e embedder test downloads real models and is excluded.
        run: |
          pytest --tb=short -q \
            --ignore=tests/test_server.py \
            --ignore=tests/test_e2e_real_embedder.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
